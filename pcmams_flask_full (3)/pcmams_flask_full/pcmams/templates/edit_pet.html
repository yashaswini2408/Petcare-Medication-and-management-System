{% extends 'base.html' %}
{% block content %}

<style>
    .edit-container {
        max-width: 650px;
        margin: auto;
        background: #ffffff;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
        animation: fadeIn 0.4s ease-in-out;
    }

    h2 {
        font-weight: 700;
        color: #2b2b2b;
        text-align: center;
        margin-bottom: 25px;
    }

    label {
        font-weight: 600;
        margin-top: 12px;
        margin-bottom: 5px;
        color: #444;
    }

    .form-control {
        border-radius: 10px;
        padding: 12px;
        font-size: 1rem;
    }

    .btn-save {
        width: 100%;
        background: linear-gradient(45deg, #6a11cb, #2575fc);
        border: none;
        padding: 12px;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 600;
        margin-top: 20px;
        color: white;
        transition: 0.3s ease;
    }

    .btn-save:hover {
        transform: translateY(-3px);
        background: linear-gradient(45deg, #5a0fbf, #1f63d6);
    }

    .image-preview {
        margin-top: 10px;
        text-align: center;
    }

    .image-preview img {
        max-height: 150px;
        border-radius: 10px;
        box-shadow: 0px 5px 15px rgba(0,0,0,0.15);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="container mt-4">
    <div class="edit-container">

        <h2>Edit Pet Details</h2>

        <form method="POST" enctype="multipart/form-data">

            <label>Name:</label>
            <input class="form-control" type="text" name="name" value="{{ pet.name }}" required>

            <label>Species:</label>
            <input class="form-control" type="text" name="species" value="{{ pet.species }}" required>

            <label>Age:</label>
            <input class="form-control" type="number" name="age" value="{{ pet.age }}" required>

            <label>Description:</label>
            <textarea class="form-control" name="description" rows="3" required>{{ pet.description }}</textarea>

            <label>Current Image:</label>
            <div class="image-preview">
                {% if pet.image %}
                    <img src="{{ url_for('static', filename='product_images/' ~ pet.image) }}" alt="Pet Image">
                {% else %}
                    <p class="text-muted">No image uploaded.</p>
                {% endif %}
            </div>

            <label>Change Image:</label>
            <input type="file" class="form-control" name="image">

            <button class="btn-save" type="submit">💾 Save Changes</button>

        </form>

    </div>
</div>

{% endblock %}
